# ============================================================
# Nginx 主配置
# - /           -> 前端静态资源（html/，放入 bedrock-ui dist）
# - /api/       -> bedrock-gateway:8080（对齐前端 VITE_API_URL=/api）
# - /websocket/ -> bedrock-websocket:8089
# ============================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Gzip（可选）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        # 前端静态资源
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # SPA：找不到文件时回退到 index.html
            try_files $uri $uri/ /index.html;
        }

        # 后端 API：去掉 /api 前缀后转发到网关
        location /api/ {
            proxy_pass http://bedrock-gateway:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 流式接口等长连接
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # WebSocket：对齐前端 VITE_WEBSOCKET_URL 前缀
        location /websocket/ {
            proxy_pass http://bedrock-websocket:8089/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }
    }
}
