# ============================================================
# Redis 自定义配置
# 密码需与 Nacos 中 spring.data.redis.password 保持一致（默认 123456）
# ============================================================

# 绑定所有网卡（容器网络内访问）
bind 0.0.0.0

# 监听端口
port 6379

# 访问密码（与 doc/docker/nacos/config/application-dev.yml 一致）
requirepass 123456

# 保护模式关闭：容器内通过服务名访问，非公网直暴露时常用
protected-mode no

# AOF 持久化（可选，便于重启后保留数据）
appendonly yes
appendfsync everysec

# 最大内存策略（按需调整）
# maxmemory 512mb
# maxmemory-policy allkeys-lru
